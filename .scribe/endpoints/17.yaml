        description: 'Must match the regex /^\d{2}:\d{2}$/.'
        required: false
        example: '64:25'
        type: string
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      'availability_schedule.days[].time_slots[].end_time':
