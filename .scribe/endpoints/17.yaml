name: 'Practitioner Applications'
description: |-

  APIs for managing practitioner/healer applications
endpoints:
  -
    custom: []
    httpMethods:
      - POST
    uri: api/practitioners/applications
    metadata:
      custom: []
      groupName: 'Practitioner Applications'
      groupDescription: |-

        APIs for managing practitioner/healer applications
      subgroup: ''
      subgroupDescription: ''
      title: 'Submit Practitioner Application'
      description: |-
        Submit a new application to become a practitioner on the platform.
        Users can upload up to 5 credential documents (PDF/JPG, max 5MB each).
        Only one pending application is allowed per user.
      authenticated: true
      deprecated: false
    headers:
      Content-Type: application/json
      Accept: application/json
    urlParameters: []
    cleanUrlParameters: []
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters:
      phone_number:
        custom: []
        name: phone_number
        description: "The practitioner's phone number."
        required: true
        example: '+1234567890'
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      professional_title:
        custom: []
        name: professional_title
        description: 'Professional title or credentials.'
        required: true
        example: 'Licensed Massage Therapist'
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      years_experience:
        custom: []
        name: years_experience
        description: 'Years of experience.'
        required: true
        example: 5-10
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      bio:
        custom: []
        name: bio
        description: 'Bio/About me (max 500 characters).'
        required: true
        example: 'Experienced massage therapist specializing in...'
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      credentials:
        custom: []
        name: credentials
        description: 'Array of credential files (1-5 files).'
        required: true
        example:
          -
            file: ...
            document_type: license
        type: 'string[]'
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      primary_category_id:
        custom: []
        name: primary_category_id
        description: 'Primary service category ID.'
        required: true
        example: 1
        type: integer
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      selected_services:
        custom: []
        name: selected_services
        description: 'The <code>id</code> of an existing record in the service_subcategories table.'
        required: false
        example:
          - 16
        type: 'integer[]'
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      service_description:
        custom: []
        name: service_description
        description: 'Description of services offered (max 1000 characters).'
        required: true
        example: 'I specialize in deep tissue massage...'
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      availability_schedule:
        custom: []
        name: availability_schedule
        description: 'Weekly availability schedule.'
        required: true
        example:
          monday:
            morning: true
            afternoon: false
            evening: true
        type: object
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      availability_schedule.schedule_type:
        custom: []
        name: availability_schedule.schedule_type
        description: ''
        required: true
        example: date_range
        type: string
        enumValues:
          - date_range
          - weekly
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      availability_schedule.start_date:
        custom: []
        name: availability_schedule.start_date
        description: 'This field is required when <code>availability_schedule.schedule_type</code> is <code>date_range</code>. Must be a valid date.'
        required: false
        example: '2026-03-09T13:56:36'
        type: string
        enumValues: []
        exampleWasSpecified: false
        nullable: true
        deprecated: false
      availability_schedule.end_date:
        custom: []
        name: availability_schedule.end_date
        description: 'This field is required when <code>availability_schedule.schedule_type</code> is <code>date_range</code>. Must be a valid date. Must be a date after or equal to <code>availability_schedule.start_date</code>.'
        required: false
        example: '2052-04-01'
        type: string
        enumValues: []
        exampleWasSpecified: false
        nullable: true
        deprecated: false
      availability_schedule.days:
        custom: []
        name: availability_schedule.days
        description: ''
        required: true
        example:
          - []
        type: 'object[]'
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
