        name: terms_agreed
        description: 'Must agree to terms of service.'
        required: true
        example: true
        type: boolean
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      'credentials[].file':
        custom: []
        name: 'credentials[].file'
        description: 'Must be a file. Must be at least 1 kilobyte. Must not be greater than 5120 kilobytes.'
        required: true
        example: null
        type: file
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      'credentials[].license_number':
        custom: []
        name: 'credentials[].license_number'
        description: 'Must not be greater than 100 characters.'
        required: true
        example: 'n'
        type: string
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      'credentials[].issuing_organization':
        custom: []
        name: 'credentials[].issuing_organization'
