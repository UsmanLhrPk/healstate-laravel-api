name: 'Service Availability Management'
description: |-

  APIs for managing service slot availability schedules. Vendors can set their weekly availability 
  (days and time ranges) for each service slot.
endpoints:
  -
    custom: []
    httpMethods:
      - POST
    uri: 'api/slots/{slot_id}/schedule'
    metadata:
      custom: []
      groupName: 'Service Availability Management'
      groupDescription: |-

        APIs for managing service slot availability schedules. Vendors can set their weekly availability 
        (days and time ranges) for each service slot.
      subgroup: ''
      subgroupDescription: ''
      title: 'Store Availability Schedule'
      description: |-
        Set or update the weekly availability schedule for a service slot. This defines which days and times
        the vendor is available for bookings. The schedule will replace any existing schedule for the slot.
      authenticated: true
      deprecated: false
    headers:
      Content-Type: application/json
      Accept: application/json
    urlParameters:
      slot_id:
        custom: []
        name: slot_id
        description: 'The ID of the slot.'
        required: true
        example: 16
        type: integer
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      slot:
        custom: []
        name: slot
        description: 'The ID of the service slot.'
        required: true
        example: 1
        type: integer
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
    cleanUrlParameters:
      slot_id: 16
      slot: 1
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters:
      schedule:
        custom: []
        name: schedule
        description: 'Array of weekly schedule data. Must contain 7 elements (one for each day).'
        required: true
        example:
          - architecto
        type: 'string[]'
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      'schedule[].day_of_week':
        custom: []
        name: 'schedule[].day_of_week'
        description: 'Day of the week (0=Sunday, 1=Monday, ..., 6=Saturday).'
        required: true
        example: 1
        type: integer
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      'schedule[].is_available':
        custom: []
        name: 'schedule[].is_available'
        description: 'Whether the vendor is available on this day.'
        required: true
        example: true
        type: boolean
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      'schedule[].time_slots':
        custom: []
        name: 'schedule[].time_slots'
        description: 'optional Array of time slots for the day. Required if is_available is true.'
        required: false
        example:
          - architecto
        type: 'string[]'
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      'schedule[].time_slots[].start_time':
        custom: []
        name: 'schedule[].time_slots[].start_time'
        description: 'Start time in HH:MM format (24-hour).'
        required: true
        example: '09:00'
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      'schedule[].time_slots[].end_time':
        custom: []
        name: 'schedule[].time_slots[].end_time'
        description: 'End time in HH:MM format (24-hour). Must be after start_time.'
        required: true
        example: '17:00'
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
    cleanBodyParameters:
      schedule:
        - architecto
    fileParameters: []
    responses:
      -
        custom: []
        status: 200
        content: |-
          {
            "message": "Availability schedule saved successfully",
            "schedule": [
              {
                "day_of_week": 0,
                "is_available": false,
                "time_slots": []
              },
              {
                "day_of_week": 1,
                "is_available": true,
                "time_slots": [
                  {
                    "start_time": "09:00",
                    "end_time": "12:00"
                  },
                  {
                    "start_time": "14:00",
                    "end_time": "18:00"
                  }
                ]
              },
              {
                "day_of_week": 2,
                "is_available": true,
                "time_slots": [
                  {
                    "start_time": "09:00",
                    "end_time": "17:00"
                  }
                ]
              },
              {
                "day_of_week": 3,
                "is_available": true,
                "time_slots": [
                  {
                    "start_time": "09:00",
                    "end_time": "17:00"
                  }
                ]
              },
              {
                "day_of_week": 4,
                "is_available": true,
                "time_slots": [
                  {
                    "start_time": "09:00",
                    "end_time": "17:00"
                  }
                ]
              },
              {
                "day_of_week": 5,
                "is_available": true,
                "time_slots": [
                  {
                    "start_time": "09:00",
                    "end_time": "17:00"
                  }
                ]
              },
              {
                "day_of_week": 6,
                "is_available": false,
                "time_slots": []
              }
            ]
          }
        headers: []
        description: ''
      -
        custom: []
        status: 403
        content: |-
          {
            "message": "Unauthorized"
          }
        headers: []
        description: ''
      -
        custom: []
        status: 422
        content: |-
          {
            "message": "The given data was invalid.",
            "errors": {
              "schedule.0.day_of_week": ["The schedule.0.day_of_week field is required."],
              "schedule.0.time_slots.0.end_time": ["The schedule.0.time_slots.0.end_time must be after schedule.0.time_slots.0.start_time."]
            }
          }
        headers: []
        description: ''
      -
        custom: []
        status: 500
        content: |-
          {
            "message": "Failed to save availability schedule",
            "error": "Database error message"
          }
        headers: []
        description: ''
    responseFields: []
    auth: []
    controller: null
    method: null
    route: null
